profile: publishing
status: experimental-non-normative
upstream:
  repository: LF-Decentralized-Trust-labs/decentralized-directory-protocol
  ref: 72d913fb4d17507891a6fea5db1f49ef7b3f461d
  synchronized_at: 2026-08-22
purpose: >-
  Exercise structural, cross-artifact, cryptographic, freshness, and lifecycle invariants
  for the upstream origin-hosted DeDi publishing model without claiming upstream
  certification or redefining protocol semantics.
checks:
  - id: PUB-001
    requirement: manifest-required-fields
    description: The example manifest exposes the required publishing fields and at least one key.
  - id: PUB-002
    requirement: manifest-proof-key-binding
    description: The manifest proof references a key declared by the manifest.
  - id: PUB-003
    requirement: unique-registry-names
    description: Registry names are unique across referenced and inline manifest entries.
  - id: PUB-004
    requirement: dedi-file-schema-shape
    description: Hosted and inline DeDi files satisfy the synchronized DeDi file JSON Schema.
  - id: PUB-005
    requirement: publisher-domain-binding
    description: Each file identifies the same publisher domain as the manifest.
  - id: PUB-006
    requirement: publisher-key-binding
    description: Each file embeds a publisher key declared by the manifest.
  - id: PUB-007
    requirement: proof-key-binding
    description: Each file proof references the embedded publisher key identifier.
  - id: PUB-008
    requirement: unique-record-names
    description: Record names are unique within each registry file.
  - id: PUB-009
    requirement: referenced-example-coverage
    description: Hosted examples correspond to registry entries referenced by the manifest.
  - id: PUB-010
    requirement: jcs-detached-jws-verification
    description: Valid manifest and file fixtures verify using RFC 8785 JCS and detached Ed25519 JWS.
  - id: PUB-011
    requirement: tamper-detection
    description: A content mutation with the original signature is rejected.
  - id: PUB-012
    requirement: key-removal-enforcement
    description: A file signed by a key removed from the current manifest is rejected.
  - id: PUB-013
    requirement: referenced-file-digest
    description: The SHA-256 digest of the hosted file matches the digest committed by the manifest.
  - id: PUB-014
    requirement: freshness-enforcement
    description: A manifest or DeDi file at or beyond next_update is rejected as stale.
  - id: PUB-015
    requirement: inactive-registry-enforcement
    description: A registry in inactive state is not accepted for current reliance.
  - id: PUB-016
    requirement: rollback-detection
    description: A candidate manifest with updated_at earlier than the last accepted state is rejected.
  - id: PUB-017
    requirement: rotation-overlap
    description: A previously used key remains acceptable while it is still present in the current manifest during rotation overlap.
  - id: PUB-018
    requirement: removed-key-rejection
    description: A file key removed from the current manifest is rejected even if it was previously authorized.
  - id: PUB-019
    requirement: cached-authority-failure-policy
    description: Refresh failure may use still-fresh cached authority but must fail closed once the cached authority is stale.
limitations:
  - Live network retrieval and TLS origin binding are not yet exercised.
  - Lifecycle vectors are deterministic offline policy checks and do not simulate distributed clock skew or transport outages.
  - Passing this profile is a fork-local validation result, not an upstream DeDi certification.
